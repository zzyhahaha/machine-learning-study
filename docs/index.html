<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>78→70 训练本</title>
<meta name="description" content="宿舍训练 + 食堂饮食的减脂计划，带动作动画指导，可以离线使用。">
<meta name="theme-color" content="#EDF1EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1411" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="训练本">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Layout: phone-first single column. Field-green "today" hero with lane lines, plain cards below, fixed bottom tabs; exercise guides open as a full-screen sheet with an animated stick figure. */
:root{
  --bg:#EDF1EB; --surface:#FFFFFF; --surface-2:#F4F7F2; --ink:#15201A; --muted:#5D6D63; --line:#D5DDD4;
  --field:#1E5B3C; --field-ink:#F1F7F1; --lane:rgba(255,255,255,.22);
  --track:#C4462B; --track-ink:#FFFFFF; --track-soft:#F6E1D9;
  --good:#2B7A4B; --good-soft:#DDEFE3; --warn:#9A6614; --warn-soft:#F6EBD6;
  --fig:#15201A; --fig-far:#A3B0A8; --prop:#3E4A43; --floor:#C9D2C8;
  --font-display:"ZCOOL QingKe HuangYou","PingFang SC","Hiragino Sans GB",sans-serif;
  --font-num:"Barlow Condensed","DIN Alternate","Helvetica Neue",Arial,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1411; --surface:#151F1A; --surface-2:#1A2620; --ink:#E4ECE6; --muted:#95A59B; --line:#283630;
  --field:#174A30; --field-ink:#E9F3EB; --lane:rgba(255,255,255,.12);
  --track:#EC6A4B; --track-ink:#1B0D08; --track-soft:#3B231C;
  --good:#5DC18A; --good-soft:#1D3527; --warn:#E2AE4C; --warn-soft:#3A2F1A;
  --fig:#E4ECE6; --fig-far:#5E6F65; --prop:#B7C4BC; --floor:#34443B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1411; --surface:#151F1A; --surface-2:#1A2620; --ink:#E4ECE6; --muted:#95A59B; --line:#283630;
  --field:#174A30; --field-ink:#E9F3EB; --lane:rgba(255,255,255,.12);
  --track:#EC6A4B; --track-ink:#1B0D08; --track-soft:#3B231C;
  --good:#5DC18A; --good-soft:#1D3527; --warn:#E2AE4C; --warn-soft:#3A2F1A;
  --fig:#E4ECE6; --fig-far:#5E6F65; --prop:#B7C4BC; --floor:#34443B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--track);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:13px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
.brand{font-family:var(--font-display);font-size:22px;letter-spacing:.02em}
.brand b{color:var(--track);font-weight:400}
.datechip{font-size:13px;color:var(--muted);text-align:right;line-height:1.3}
.sync{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--fig-far);margin-right:5px;vertical-align:1px}
.sync.on{background:var(--good)}

.view{display:flex;flex-direction:column;gap:14px;padding-block:4px 8px}
.sec-title{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:10px 2px -4px}

/* field hero */
.field{position:relative;overflow:hidden;background:var(--field);color:var(--field-ink);border-radius:18px;padding:18px 18px 16px;
  background-image:repeating-linear-gradient(90deg,transparent 0 46px,var(--lane) 46px 48px)}
.field .eyebrow{font-size:12px;letter-spacing:.14em;opacity:.8}
.field h2{font-family:var(--font-display);font-weight:400;font-size:34px;margin-top:4px}
.field .meta{font-size:13px;opacity:.85;margin-top:2px}
.switch{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.switch button{border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--field-ink);border-radius:999px;padding:4px 12px;font-size:13px}
.switch button[aria-pressed="true"]{background:var(--field-ink);color:var(--field);border-color:var(--field-ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h3{font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 .tag{font-size:12px;font-weight:500;color:var(--muted)}
.card > * + *{margin-top:10px}
.list{margin:0;padding-left:1.2em}
.list li + li{margin-top:4px}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted)}
.note b{color:var(--ink)}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}
.goodbox{background:var(--good-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:16px;min-height:46px}
.btn.primary{background:var(--track);color:var(--track-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px;border-radius:10px}
.linkbtn{background:none;border:0;padding:0;color:var(--track);font-weight:600;font-size:14px}

/* exercise rows */
.exlist{display:flex;flex-direction:column}
.exrow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.exrow:first-child{border-top:0}
.exrow .idx{font-family:var(--font-num);font-size:22px;font-weight:700;color:var(--muted);text-align:center}
.exrow .nm{font-weight:700;font-size:15px}
.exrow .sub{font-size:12px;color:var(--muted)}
.exrow .rx{font-family:var(--font-num);font-size:19px;font-weight:600;white-space:nowrap}
.exrow .how{font-size:12px;color:var(--track);font-weight:600}

/* logger */
.logex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.logex.done{border-color:var(--good)}
.loghead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.loghead .nm{font-weight:700;font-size:16px}
.loghead .rx{font-family:var(--font-num);font-size:18px;font-weight:600;white-space:nowrap}
.last{font-size:12px;color:var(--muted);margin-top:2px}
.sets{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center}
.setrow.noload{grid-template-columns:28px 1fr 48px}
.setrow .sn{font-family:var(--font-num);font-size:18px;color:var(--muted);text-align:center}
.field-in{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 10px;min-width:0}
.field-in input{width:100%;min-width:0;border:0;background:transparent;font-size:17px;padding:9px 0;font-family:var(--font-num);font-variant-numeric:tabular-nums;outline:none}
.field-in span{font-size:12px;color:var(--muted);white-space:nowrap}
.tick{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;line-height:1;color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}

/* check chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--good);background:var(--good-soft)}
.chip[aria-pressed="true"]::before{content:"✓ ";color:var(--good);font-weight:700}

.protein{display:flex;align-items:baseline;gap:8px}
.protein .big{font-family:var(--font-num);font-size:40px;font-weight:700;line-height:1}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--track);border-radius:99px;transition:width .3s}
.addgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.addgrid button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 4px;font-size:13px;line-height:1.3}
.addgrid button b{display:block;font-family:var(--font-num);font-size:17px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border-radius:10px;padding:8px 2px;text-align:center;background:var(--surface-2);font-size:12px;line-height:1.35;border:1px solid transparent}
.day b{display:block;font-size:13px}
.day.today{border-color:var(--track);background:var(--track-soft)}
.day.s b{color:var(--track)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:600;color:var(--muted);font-size:12px;border-top:0}
.tbl td.n{font-family:var(--font-num);font-size:16px;white-space:nowrap;text-align:right}
.scroll-x{overflow-x:auto}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--font-num);font-size:26px;font-weight:700;line-height:1.1}
.stat .v small{font-size:13px;font-weight:500;color:var(--muted)}
.inrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.inrow label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-num);font-size:11px;fill:var(--muted)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--track);font-weight:700}

/* rest timer */
.timer{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:19;padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.timer .in{max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.timer .t{font-family:var(--font-num);font-size:28px;font-weight:700;min-width:70px}
.timer .lbl{flex:1;font-size:13px;line-height:1.35}
.timer button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:9px;padding:5px 10px;font-size:13px}
.timer.over .in{background:var(--good);color:var(--surface)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .wrap{display:flex;flex-direction:column;gap:12px;padding-block:8px 24px}
.sheethead{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:8px;z-index:2}
.sheethead h2{flex:1;font-family:var(--font-display);font-weight:400;font-size:26px}
.close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;position:relative}
.stage svg{display:block;width:100%;height:auto}
.stage .play{position:absolute;right:10px;top:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--track);background:var(--track-soft);font-weight:700}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:8px}
.steps li::before{content:counter(s);font-family:var(--font-num);font-weight:700;font-size:15px;width:24px;height:24px;border-radius:50%;background:var(--track-soft);color:var(--track);display:flex;align-items:center;justify-content:center;margin-top:1px}
.xlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.xlist li{display:grid;grid-template-columns:20px 1fr;gap:6px}
.xlist li::before{content:"✕";color:var(--track);font-weight:700}
.olist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.olist li{display:grid;grid-template-columns:20px 1fr;gap:6px}
.olist li::before{content:"●";color:var(--good);font-size:10px;margin-top:5px}
.ext{display:inline-flex;align-items:center;gap:6px;color:var(--track);font-weight:700;text-decoration:none}
.fig-cap{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 4px}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
.inrow label.btn{font-size:16px;color:var(--ink);flex-direction:row;gap:6px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">78<b>→</b>70 训练本</div>
    <div class="datechip"><div id="dateText">—</div><div class="small"><span class="sync" id="syncDot"></span><span id="syncText">连接中</span></div></div>
  </header>

  <main>
    <section class="view" id="v-today" data-view="today"></section>
    <section class="view" id="v-train" data-view="train" hidden></section>
    <section class="view" id="v-food" data-view="food" hidden></section>
    <section class="view" id="v-log" data-view="log" hidden></section>
  </main>
</div>

<div class="timer" id="timer" hidden>
  <div class="in">
    <div class="t" id="timerT">1:30</div>
    <div class="lbl" id="timerL">组间休息，喝口水</div>
    <button type="button" id="timerAdd">+30秒</button>
    <button type="button" id="timerSkip">跳过</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="wrap" id="sheetBody"></div>
</div>

<nav class="nav" aria-label="页面">
  <div class="in">
    <button type="button" data-tab="today" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9 14.5l2 2 4-4"/></svg>今天</button>
    <button type="button" data-tab="train">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>训练</button>
    <button type="button" data-tab="food">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-1.5 1-1.5 1-3M12 7c0-1.5 1-1.5 1-3M16 7c0-1.5 1-1.5 1-3"/></svg>饮食</button>
    <button type="button" data-tab="log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M5 15l4-4 3 3 6-7"/><circle cx="18" cy="7" r="1.2" fill="currentColor"/></svg>记录</button>
  </div>
</nav>

<script>
"use strict";
/* ---------- content ---------- */
const EX = {
  squat:{name:'高脚杯深蹲',muscles:'大腿前侧、臀部、核心',equip:'一只哑铃（没有就徒手，或背上装书的书包）',start:'起始重量参考：8–12kg',
    variants:[{anim:'goblet',label:'高脚杯深蹲'},{anim:'bwsquat',label:'徒手深蹲（简单）',note:'双臂向前平举帮助平衡，其他要点完全一样。一组能轻松做 20 个，就改成背书包或拿哑铃。'}],
    steps:['双脚略比肩宽，脚尖稍微朝外（15–30°）。','双手竖着捧住哑铃的一端，贴在胸前。','吸气，屁股往后、往下坐，膝盖朝脚尖方向打开。','蹲到大腿至少和地面平行（背不弯的前提下可以更低）。','整个脚掌踩地发力站起，站直时呼气。'],
    cues:['全程挺胸，背不要弯','膝盖和脚尖朝同一个方向，不要往里扣','脚跟一直踩实地面','哑铃始终贴着胸口'],
    mistakes:['膝盖往里扣','脚跟抬起，重心跑到脚尖','下蹲时弯腰低头','只蹲一点点就起来'],
    breath:'下蹲吸气，站起呼气',search:'高脚杯深蹲 动作教学'},
  pushup:{name:'俯卧撑',muscles:'胸部、肩前侧、手臂后侧、核心',equip:'不需要器材',
    variants:[{anim:'pushup',label:'标准俯卧撑'},{anim:'incline',label:'上斜俯卧撑（简单）',note:'双手撑在床沿或桌沿上做，撑的地方越高越简单。一组能做 15 个以上，就换低一点的地方，最后过渡到地面。'}],
    steps:['双手撑地，比肩稍宽，手指朝前。','双脚并拢或稍分开，从头到脚跟绷成一条直线。','吸气，弯曲手肘，身体整体下降，直到胸口离地约一拳。','手掌用力推地，呼气，回到手臂伸直。'],
    cues:['收紧肚子和屁股，身体像一块木板','手肘和身体夹角约 45°，不要张开成 T 字','下放时控制住，不要砸下去'],
    mistakes:['塌腰，肚子先碰地','屁股撅得很高','只做半程，胸口离地很远','耸肩缩脖子'],

  return {hd,sh,hp,n:{el,ha,kn,an,to},back:mat(50,220)};}
function bridge(t){const e=rep(t,.33,.15,.35),sh=[60,FL-7],hd=[46,FL-9],an=[150,FL-6],to=[161,FL-2];
  const hp=P(sh,lerp(-3,-22,e),S.torso),[kn]=ik(hp,an,S.th,S.sh,-1);
  return {hd,sh,hp,n:{el:[86,FL-4],ha:[110,FL-3],kn,an,to},back:mat(30,190)};}
function deadbug(t){const first=t<.5,e=rep((t*2)%1,.4,.15,.4),hd=[42,FL-12],sh=[56,FL-9],hp=[106,FL-9];
  const arm=x=>{const a=lerp(-90,-168,x),el=P(sh,a,S.ua);return {el,ha:P(el,a,S.fa)};};
  const leg=x=>{const ta=lerp(-90,-12,x),sa=lerp(0,-12,x),kn=P(hp,ta,S.th),an=P(kn,sa,S.sh);return {kn,an,to:P(an,sa-80,11)};};
  const nA=arm(first?e:0),fA=arm(first?0:e),nL=leg(first?0:e),fL=leg(first?e:0);
  return {hd,sh,hp,n:{...nA,...nL},f:{...fA,...fL},back:mat(26,200)};}
function crunch(t){const e=rep(t,.33,.15,.35),hp=[108,FL-9],an=[152,FL-6],to=[163,FL-2],[kn]=ik(hp,an,S.th,S.sh,-1);
  const a=lerp(178,206,e),sh=P(hp,a,S.torso),hd=P(sh,a+lerp(4,16,e),S.neck),el=P(P(sh,a-180,20),a-270,7),ha=P(P(sh,a-180,5),a-270,10);
  return {hd,sh,hp,n:{el,ha,kn,an,to},back:mat(26,200)};}
function bandrow(t){const e=rep(t,.33,.12,.38),hp=[92,FL-8],kn=[134,FL-7],an=[174,FL-6],to=[180,FL-17],anchor=[181,FL-12];
  const ta=lerp(-74,-90,e),sh=P(hp,ta,S.torso),hd=P(sh,ta,S.neck),[el,ha]=ik(sh,lp([sh[0]+47,sh[1]+14],[sh[0]+6,sh[1]+26],e),S.ua,S.fa,1);
  return {hd,sh,hp,n:{el,ha,kn,an,to},back:mat(60,200),front:Ln(anchor,ha,'bd')};}

const ANIM = {goblet:t=>squat(t,true),bwsquat:t=>squat(t,false),pushup:t=>pushup(t,0),incline:t=>pushup(t,40),row,bandrow,rdl,plank,split,
  pullup:t=>pullup(t,false),negative:t=>pullup(t,true),invrow,press,pike,bridge,deadbug,crunch};
const PERIOD = {deadbug:6400,negative:5200,plank:4000,pullup:3400,invrow:3200};
const CAPTION = {goblet:'下蹲吸气 · 站起呼气',bwsquat:'双臂前举保持平衡',pushup:'身体保持一条直线',incline:'手撑床沿，越高越简单',row:'手肘往腰的方向拉',
  bandrow:'弹力带绕过脚底',rdl:'屁股往后推，背始终挺直',plank:'虚线：头到脚跟一条直线',split:'后脚搭在椅子上',pullup:'先沉肩，再把下巴拉过杠',
  negative:'快速到顶，用 3–5 秒慢慢放下',invrow:'身体绷直，胸口拉向杠',press:'推到头顶正上方',pike:'倒 V 字，头顶向地面靠近',
  bridge:'最高点肩、髋、膝成一条线',deadbug:'对侧手脚同时伸出，腰贴地',crunch:'只卷起肩膀，不用坐起来'};

function frameSVG(p){let s=Ln([4,FL],[236,FL],'fl')+(p.back||'')+(p.guide||'');
  if(p.f){if(p.f.ha)s+=PL([p.sh,p.f.el,p.f.ha],'lf');if(p.f.an)s+=PL([p.hp,...legPts(p.f)],'lf');}
  s+=PL([p.hp,p.sh,p.hd],'ln')+C(p.hd,9,'hd')+PL([p.hp,...legPts(p.n)],'ln')+PL([p.sh,p.n.el,p.n.ha],'ln')+(p.front||'');
  return s;}

const Player = {raf:0,key:null,g:null,t0:0,playing:true,
  mount(g,key){this.stop();this.g=g;this.key=key;this.t0=performance.now();
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;this.playing=!reduce;
    if(reduce){this.draw(.5);}else this.loop();return this.playing;},
  draw(tau){if(this.g)this.g.innerHTML=frameSVG(ANIM[this.key](tau));},
  loop(){const per=PERIOD[this.key]||3200;const step=now=>{this.draw(((now-this.t0)%per)/per);this.raf=requestAnimationFrame(step);};this.raf=requestAnimationFrame(step);},
  toggle(){if(this.playing){cancelAnimationFrame(this.raf);this.playing=false;}else{this.playing=true;this.t0=performance.now();this.loop();}return this.playing;},
  stop(){cancelAnimationFrame(this.raf);this.raf=0;this.g=null;}
};

/* ---------- dates ---------- */
const pad = n=>String(n).padStart(2,'0');
const ymd = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = ()=>ymd(new Date());
const parseYmd = s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays = (s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const WD = ['日','一','二','三','四','五','六'];
const mdText = s=>{const d=parseYmd(s);return `${d.getMonth()+1}月${d.getDate()}日`;};
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o=>JSON.parse(JSON.stringify(o||{}));
const lsGet = k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet = (k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const isStandalone = ()=>window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;

/* ---------- storage: claude.ai db when available, this device otherwise ---------- */
const COLS = ['body','sessions','days'];
function setSync(state){
  const dot=document.getElementById('syncDot'),txt=document.getElementById('syncText');
  const map={local:['on','数据存在这台手机上'],ok:['on','已同步到账号'],loading:['','正在读取…'],slow:['','网络慢，稍后同步'],err:['','保存失败，稍后重试']};
  const [cls,label]=map[state]||map.loading;dot.className='sync '+cls;txt.textContent=label;}
const Store = {
  mode:'local',db:null,data:{body:{},sessions:{},days:{}},unsynced:new Set(),timers:{},writing:{},again:{},confirmed:new Set(),fns:new Set(),
  on(fn){this.fns.add(fn);}, emit(){this.fns.forEach(f=>f());},
  loadLocal(){try{const j=JSON.parse(lsGet('t78-data')||'null');if(j)COLS.forEach(c=>{this.data[c]=j[c]||{};});}catch(e){}},
  saveLocal(){lsSet('t78-data',JSON.stringify(this.data));},
  async init(){
    let db=null;
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
    if(!db){this.mode='local';this.loadLocal();setSync('local');this.emit();return;}
    this.db=db;this.mode='db';setSync('loading');
    const slow=setTimeout(()=>{if(this.confirmed.size<COLS.length)setSync('slow');},10000);
    COLS.forEach(col=>{
      db.collection(col).onSnapshot(snap=>{
        const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=d.data();});
        this.unsynced.forEach(k=>{const [c,id]=k.split('/');if(c===col){if(this.data[col][id]===undefined)delete m[id];else m[id]=this.data[col][id];}});
        this.data[col]=m;
        if(!snap.metadata.fromCache){this.confirmed.add(col);if(this.confirmed.size===COLS.length){clearTimeout(slow);setSync('ok');}}
        this.emit();
      },err=>{clearTimeout(slow);setSync('err');console.warn('db',col,err&&err.code);});
    });
  },
  get(col,id){return this.data[col][id];},
  put(col,id,obj,silent){this.data[col]={...this.data[col],[id]:obj};if(!silent)this.emit();this.persist(col,id);},
  del(col,id){const m={...this.data[col]};delete m[id];this.data[col]=m;this.emit();this.persist(col,id);},
  persist(col,id){
    if(this.mode!=='db'){this.saveLocal();return;}
    const k=col+'/'+id;this.unsynced.add(k);clearTimeout(this.timers[k]);this.timers[k]=setTimeout(()=>this.flush(col,id),500);},
  async flush(col,id){
    const k=col+'/'+id;if(this.writing[k]){this.again[k]=true;return;}
    this.writing[k]=true;this.again[k]=false;
    try{const v=this.data[col][id],ref=this.db.collection(col).doc(id);
      if(v===undefined)await ref.delete();else await ref.set(clone(v));
      if(!this.again[k])this.unsynced.delete(k);setSync('ok');}
    catch(e){if(e&&(e.code==='unavailable'||e.code==='resource_exhausted')){setSync('slow');setTimeout(()=>this.flush(col,id),1500+Math.random()*1500);}
      else{setSync('err');console.warn('write',k,e&&e.code);}}
    finally{this.writing[k]=false;if(this.again[k]){this.again[k]=false;this.flush(col,id);}}
  }
};

/* ---------- rest timer + screen wake ---------- */
const Timer = {end:0,int:0,label:'',ac:null,
  start(sec,label){this.end=Date.now()+sec*1000;this.label=label;const el=document.getElementById('timer');el.hidden=false;el.classList.remove('over');
    clearInterval(this.int);this.tick();this.int=setInterval(()=>this.tick(),250);},
  add(sec){this.end=Math.max(this.end,Date.now())+sec*1000;document.getElementById('timer').classList.remove('over');clearInterval(this.int);this.int=setInterval(()=>this.tick(),250);this.tick();},
  tick(){const left=Math.ceil((this.end-Date.now())/1000),el=document.getElementById('timer');
    if(left<=0){clearInterval(this.int);el.classList.add('over');document.getElementById('timerT').textContent='0:00';document.getElementById('timerL').textContent='休息结束，开始下一组';this.beep();setTimeout(()=>{if(el.classList.contains('over'))el.hidden=true;},6000);return;}
    document.getElementById('timerT').textContent=`${Math.floor(left/60)}:${pad(left%60)}`;document.getElementById('timerL').textContent=this.label;},
  stop(){clearInterval(this.int);document.getElementById('timer').hidden=true;},
  unlock(){try{if(!this.ac){const A=window.AudioContext||window.webkitAudioContext;if(A)this.ac=new A();}if(this.ac&&this.ac.state==='suspended')this.ac.resume();}catch(e){}},
  beep(){try{const ac=this.ac;if(!ac)return;[0,.22].forEach(d=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,ac.currentTime+d);g.gain.exponentialRampToValueAtTime(.25,ac.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d+.18);o.connect(g).connect(ac.destination);o.start(ac.currentTime+d);o.stop(ac.currentTime+d+.2);});}catch(e){}}
};
const Wake = {lock:null,want:false,
  async on(){this.want=true;try{if('wakeLock' in navigator)this.lock=await navigator.wakeLock.request('screen');}catch(e){this.lock=null;}},
  off(){this.want=false;try{this.lock&&this.lock.release();}catch(e){}this.lock=null;}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Wake.want)Wake.on();});

/* ---------- plan logic ---------- */
const UI = {tab:'today',override:null,workout:false,sheet:null};
const started = s=>!!s&&(s.done||Object.values(s.sets||{}).some(a=>a.some(x=>x&&x.ok)));
function firstDate(){let m=null;COLS.forEach(c=>Object.keys(Store.data[c]).forEach(k=>{const d=k.slice(0,10);if(/^\d{4}-\d\d-\d\d$/.test(d)&&(!m||d<m))m=d;}));return m;}
function weekNo(){const f=firstDate();if(!f)return 1;return Math.floor((parseYmd(today())-parseYmd(f))/864e5/7)+1;}
function lastStrength(before){let best=null;Object.values(Store.data.sessions).forEach(s=>{if((s.type==='A'||s.type==='B')&&s.date<before&&started(s)&&(!best||s.date>best.date))best=s;});return best;}
function lastSetsFor(type,ex,before){let best=null;Object.values(Store.data.sessions).forEach(s=>{if(s.type===type&&s.date<before&&s.sets&&s.sets[ex]&&s.sets[ex].some(x=>x&&x.ok)&&(!best||s.date>best.date))best=s;});return best?best.sets[ex]:null;}
function todayKind(){
  const d=today(),ss=Store.data.sessions;
  if(UI.override)return UI.override;
  if(started(ss[d+'_A']))return 'A';if(started(ss[d+'_B']))return 'B';if(ss[d+'_C']&&ss[d+'_C'].done)return 'C';
  const k=WEEK[new Date().getDay()].k;
  if(k==='S'){const l=lastStrength(d);return l&&l.type==='A'?'B':'A';}
  return k;}
function rxText(it){return it.reps==='尽量多'?`${it.sets} 组 · 尽量多`:`${it.sets} × ${it.reps}${it.unit||''}${it.each?' 每侧':''}`;}
function restFor(ex){return ex==='plank'?60:ex==='pullup'?120:90;}
function fmtSets(arr,it){return arr.filter(x=>x&&x.ok).map(x=>(it.load&&x.kg?x.kg+'kg×':'')+(x.r??'?')).join(' · ');}

function strengthBlock(kind,d){
  const id=d+'_'+kind,s=Store.get('sessions',id),plan=PLAN[kind];
  if(s&&s.done&&!UI.workout){
    const n=Object.values(s.sets||{}).reduce((a,arr)=>a+arr.filter(x=>x&&x.ok).length,0);
    return `<div class="goodbox"><b>今天的${plan.name}完成了 ✓</b> 一共 ${n} 组。记得吃一顿有肉的正餐。</div>
      <div class="card"><h3>今天的记录</h3>${plan.items.map(it=>{const arr=(s.sets||{})[it.ex]||[];return `<div class="small"><b>${EX[it.ex].name}</b>　<span class="num">${fmtSets(arr,it)||'—'}</span></div>`;}).join('')}
      <button class="btn ghost sm" data-act="reopen" data-k="${kind}">继续修改</button></div>`;}
  if(!UI.workout&&!started(s)){
    return `<div class="card"><h3>今天练这 5 个动作<span class="tag">点动作看怎么做</span></h3><div class="exlist">${plan.items.map((it,i)=>exRow(it,i)).join('')}</div>
      <div class="note"><b>先热身 5–10 分钟：</b>原地快走 2 分钟，转转肩膀和髋，第一个动作先用轻重量做一组。</div>
      <button class="btn primary block" data-act="start" data-k="${kind}">开始训练</button></div>`;}
  return plan.items.map((it,i)=>logEx(kind,id,s,it,i,d)).join('')+
    `<button class="btn primary block" data-act="finish" data-k="${kind}">完成训练</button><p class="small muted" style="text-align:center">每勾一组会自动保存，并开始组间休息倒计时。</p>`;}

function exRow(it,i){const ex=EX[it.ex];
  return `<button type="button" class="exrow" data-act="ex" data-ex="${it.ex}" data-rx="${esc(rxText(it))}"><span class="idx">${i+1}</span>
    <span><span class="nm">${ex.name}</span><br><span class="sub">${ex.muscles}</span></span>
    <span style="text-align:right"><span class="rx">${rxText(it)}</span><br><span class="how">看动作 ›</span></span></button>`;}

function logEx(kind,id,s,it,i,d){
  const ex=EX[it.ex],arr=(s&&s.sets&&s.sets[it.ex])||[],last=lastSetsFor(kind,it.ex,d);
  const done=arr.filter(x=>x&&x.ok).length>=it.sets,unit=it.unit==='秒'?'秒':'次';
  let rows='';
  for(let n=0;n<it.sets;n++){const x=arr[n]||{},lx=(last&&last[n])||{};
    const kgPh=lx.kg??'',rPh=lx.r??(it.reps==='尽量多'?'':String(it.reps).split('–')[0]);
    rows+=`<div class="setrow${it.load?'':' noload'}"><span class="sn">${n+1}</span>
      ${it.load?`<label class="field-in"><input id="kg-${id}-${it.ex}-${n}" inputmode="decimal" type="text" placeholder="${esc(kgPh)}" value="${esc(x.kg??'')}" data-act="in" data-f="kg" data-id="${id}" data-ex="${it.ex}" data-n="${n}" aria-label="第${n+1}组重量"><span>kg</span></label>`:''}
      <label class="field-in"><input id="r-${id}-${it.ex}-${n}" inputmode="numeric" type="text" placeholder="${esc(rPh)}" value="${esc(x.r??'')}" data-act="in" data-f="r" data-id="${id}" data-ex="${it.ex}" data-n="${n}" aria-label="第${n+1}组${unit}数"><span>${unit}</span></label>
      <button type="button" class="tick" aria-pressed="${!!x.ok}" aria-label="第${n+1}组完成" data-act="tick" data-id="${id}" data-ex="${it.ex}" data-n="${n}" data-k="${kind}">✓</button></div>`;}
  return `<div class="logex${done?' done':''}"><div class="loghead"><div><button class="linkbtn" style="color:var(--ink);font-size:16px" data-act="ex" data-ex="${it.ex}" data-rx="${esc(rxText(it))}">${i+1}. ${ex.name} <span style="color:var(--track);font-size:13px">动作 ›</span></button>
    <div class="last">${last?'上次：<span class="num">'+esc(fmtSets(last,it))+'</span>':'第一次做：先用轻重量把动作做标准'}</div></div><div class="rx">${rxText(it)}</div></div>
    <div class="sets">${rows}</div></div>`;}

function cardioBlock(d){const id=d+'_C',s=Store.get('sessions',id)||{},type=s.kind||'跑走结合';
  return `<div class="card"><h3>做哪种有氧</h3><div class="chips">${CARDIO_TYPES.map(t=>`<button type="button" class="chip" data-act="ctype" data-t="${t}" aria-pressed="${t===type}">${t}</button>`).join('')}</div>

  v.innerHTML=h;}

const bodyList = ()=>Object.values(Store.data.body).filter(b=>b&&typeof b.w==='number'&&b.d).sort((a,b)=>a.d<b.d?-1:1);
function avgWindow(k){const end=addDays(today(),-7*k),start=addDays(end,-6),xs=bodyList().filter(b=>b.d>=start&&b.d<=end).map(b=>b.w);return xs.length>=3?xs.reduce((a,b)=>a+b,0)/xs.length:null;}
function advice(){const n=bodyList().length,w0=avgWindow(0),w1=avgWindow(1),w2=avgWindow(2);
  if(!n)return ['note','先连续记一周体重（每天早上空腹称），之后这里会按周平均给你调整建议。'];
  if(w0==null||w1==null)return ['note',`已经记了 ${n} 天。满两周、每周至少 3 天后开始给建议。`];
  const r=w0-w1;
  if(r<=-1)return ['warnbox',`这周平均比上周轻了 ${(-r).toFixed(1)}kg，掉得偏快。如果很累、力气变小，每天加一份主食或一次加餐。`];
  if(r<=-0.3)return ['goodbox',`这周平均比上周轻了 ${(-r).toFixed(1)}kg，节奏正好，照现在这样继续。`];
  if(w2!=null&&(w1-w2)>-0.3)return ['warnbox','连续两周平均体重几乎没降：晚饭的米饭少吃三分之一到一半，或者每天多走 3000 步。'];
  return ['note',`这周平均只变化了 ${r>0?'+':''}${r.toFixed(1)}kg，再观察一周。刚开始练的几周，腰围变小也说明在减脂。`];}
function chartSVG(list){const end=today(),start=addDays(end,-41),pts=list.filter(b=>b.d>=start);
  if(pts.length<2)return '<p class="small muted">记满两天后，这里会出现体重曲线。</p>';
  const W=320,H=170,L=34,Rr=8,T=10,B=22,ws=pts.map(p=>p.w);let lo=Math.floor(Math.min(...ws)-.5),hi=Math.ceil(Math.max(...ws)+.5);if(hi-lo<2)hi=lo+2;
  const x=d=>L+(W-L-Rr)*((parseYmd(d)-parseYmd(start))/864e5)/41,y=w=>T+(H-T-B)*(hi-w)/(hi-lo),step=(hi-lo)>6?2:1;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="最近 6 周体重曲线">`;
  for(let v=lo;v<=hi;v+=step)s+=`<line x1="${L}" x2="${W-Rr}" y1="${f1(y(v))}" y2="${f1(y(v))}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${f1(y(v)+4)}" text-anchor="end">${v}</text>`;
  [start,addDays(start,21),end].forEach((d,i)=>{s+=`<text x="${f1(x(d))}" y="${H-5}" text-anchor="${['start','middle','end'][i]}">${parseYmd(d).getMonth()+1}/${parseYmd(d).getDate()}</text>`;});
  const av=pts.map(p=>{const from=addDays(p.d,-6),xs=list.filter(b=>b.d>=from&&b.d<=p.d).map(b=>b.w);return xs.length>=2?[x(p.d),y(xs.reduce((a,b)=>a+b,0)/xs.length)]:null;}).filter(Boolean);
  if(av.length>=2)s+=`<polyline points="${av.map(q=>f1(q[0])+','+f1(q[1])).join(' ')}" fill="none" stroke="var(--track)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{const lastP=i===pts.length-1;s+=`<circle cx="${f1(x(p.d))}" cy="${f1(y(p.w))}" r="${lastP?4:2.6}" fill="${lastP?'var(--track)':'var(--fig-far)'}"/>`;});
  return s+'</svg><p class="small muted">灰点是每天的体重，红线是 7 天平均。</p>';}

function exportData(){
  const json=JSON.stringify({app:'t78',version:1,exported:new Date().toISOString(),data:Store.data}),name=`78to70-backup-${today()}.json`;
  try{const file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'训练本备份'}).catch(()=>{});return;}}catch(e){}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);toast('已导出');}catch(e){toast('导出失败，请再试一次');}}
document.addEventListener('change',e=>{if(e.target.id!=='importFile')return;const f=e.target.files&&e.target.files[0];if(!f)return;

      COLS.forEach(c=>{const src=d[c]||{};Object.keys(src).forEach(k=>{Store.data[c]={...Store.data[c],[k]:src[k]};n++;});});
      Store.saveLocal();Store.emit();toast(`已导入 ${n} 条记录`);}catch(err){toast('这个文件不是训练本的备份');}e.target.value='';};
  r.readAsText(f);});

/* ---------- exercise sheet ---------- */
function openSheet(ex,rx){UI.sheet={ex,v:0,rx:rx||''};renderSheet();const s=document.getElementById('sheet');s.hidden=false;s.scrollTop=0;document.body.style.overflow='hidden';}
function renderSheet(){const {ex:key,v,rx}=UI.sheet,ex=EX[key],va=ex.variants[v];
  document.getElementById('sheetBody').innerHTML=`<div class="sheethead"><h2 id="sheetTitle">${ex.name}</h2><button type="button" class="close" data-act="close" aria-label="关闭">✕</button></div>
  ${ex.variants.length>1?`<div class="seg" role="group" aria-label="动作版本">${ex.variants.map((x,i)=>`<button type="button" data-act="variant" data-i="${i}" aria-pressed="${i===v}">${x.label}</button>`).join('')}</div>`:''}
  <div class="stage"><svg viewBox="0 0 240 180" class="fig" role="img" aria-label="${esc(va.label)}动作示意动画"><g id="figG"></g></svg>
    <button type="button" class="btn ghost sm play" data-act="play" id="playBtn">暂停</button><div class="fig-cap">${CAPTION[va.anim]||''}</div></div>
  ${rx?`<div class="note">今天：<b>${esc(rx)}</b></div>`:''}
  ${va.note?`<div class="goodbox"><b>${va.label}怎么做：</b>${va.note}</div>`:''}
  <dl class="facts"><dt>练哪里</dt><dd>${ex.muscles}</dd><dt>器材</dt><dd>${ex.equip}</dd><dt>呼吸</dt><dd>${ex.breath}</dd>${ex.start?`<dt>重量</dt><dd>${ex.start}</dd>`:''}</dl>
  ${ex.warn?`<div class="warnbox">${ex.warn}</div>`:''}
  <div class="card"><h3>${v>0?'标准动作步骤':'步骤'}</h3><ol class="steps">${ex.steps.map(x=>`<li><span>${x}</span></li>`).join('')}</ol></div>
  <div class="card"><h3>要点</h3><ul class="olist">${ex.cues.map(x=>`<li><span>${x}</span></li>`).join('')}</ul></div>
  <div class="card"><h3>常见错误</h3><ul class="xlist">${ex.mistakes.map(x=>`<li><span>${x}</span></li>`).join('')}</ul></div>
  ${ex.extra?`<div class="note">${ex.extra}</div>`:''}
  <a class="ext" href="https://search.bilibili.com/all?keyword=${encodeURIComponent(ex.search)}" target="_blank" rel="noopener">在 B 站看真人示范 ↗</a>
  <p class="small muted">动画是简化的侧面示意。第一次做新动作，最好再看一遍真人视频，或者对着镜子、录视频检查。</p>`;
  document.getElementById('playBtn').textContent=Player.mount(document.getElementById('figG'),va.anim)?'暂停':'播放';}
function closeSheet(){Player.stop();document.getElementById('sheet').hidden=true;UI.sheet=null;document.body.style.overflow='';}

/* ---------- actions ---------- */
const parseNum = v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:null;};
function toast(msg){let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');t.style.cssText='position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;max-width:90vw';document.body.appendChild(t);}
  t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>{t.hidden=true;},1800);}
function sessionFor(id){const cur=Store.get('sessions',id),[date,type]=id.split('_');return cur?clone(cur):{date,type,sets:{},done:false};}
function updateSet(id,ex,n,patch,rerender){const s=sessionFor(id),it=PLAN[s.type].items.find(i=>i.ex===ex);s.sets=s.sets||{};
  const arr=(s.sets[ex]||[]).slice();while(arr.length<it.sets)arr.push(null);arr[n]={...(arr[n]||{}),...patch};s.sets[ex]=arr;s.updated=new Date().toISOString();
  Store.put('sessions',id,s,!rerender);}
function tickSet(t){Timer.unlock();const {id,ex}=t.dataset,n=+t.dataset.n,cur=(((Store.get('sessions',id)||{}).sets||{})[ex]||[])[n]||{},on=!cur.ok,patch={ok:on};
  if(on){const rIn=document.getElementById(`r-${id}-${ex}-${n}`),kgIn=document.getElementById(`kg-${id}-${ex}-${n}`);
    if(rIn){const x=parseNum(rIn.value)??parseNum(rIn.placeholder);if(x!=null)patch.r=x;}
    if(kgIn){const x=parseNum(kgIn.value)??parseNum(kgIn.placeholder);if(x!=null)patch.kg=x;}}
  updateSet(id,ex,n,patch,true);
  if(on){const it=PLAN[id.split('_')[1]].items.find(i=>i.ex===ex),cnt=Store.get('sessions',id).sets[ex].filter(x=>x&&x.ok).length,nm=EX[ex].name;
    Timer.start(restFor(ex),cnt>=it.sets?`${nm}做完了，休息后换下一个动作`:`${nm}第 ${cnt} 组完成，休息一下`);}}
function startWorkout(k){UI.workout=true;UI.override=k;Timer.unlock();Wake.on();render();window.scrollTo(0,0);}
function finishWorkout(k){const id=today()+'_'+k,s=sessionFor(id);s.done=true;s.updated=new Date().toISOString();Store.put('sessions',id,s);UI.workout=false;Timer.stop();Wake.off();window.scrollTo(0,0);toast('训练完成，已保存');}
function setCardio(patch,silent){const d=today(),id=d+'_C',cur=Store.get('sessions',id),s=cur?clone(cur):{date:d,type:'C',kind:'跑走结合',min:null,done:false};Object.assign(s,patch);Store.put('sessions',id,s,silent);}
function dayDoc(){const d=today(),cur=Store.get('days',d);return cur?clone(cur):{date:d};}
function toggleHabit(k){const x=dayDoc();x.habits={...(x.habits||{}),[k]:!(x.habits||{})[k]};Store.put('days',x.date,x);}
function addProtein(g){const x=dayDoc();x.protein=(x.protein||0)+g;x.plog=[...(x.plog||[]),g].slice(-40);Store.put('days',x.date,x);}
function undoProtein(){const x=dayDoc(),log=(x.plog||[]).slice(),g=log.pop()||0;x.plog=log;x.protein=Math.max(0,(x.protein||0)-g);Store.put('days',x.date,x);}
function saveWeight(date,wStr,waistStr){
  if(!/^\d{4}-\d\d-\d\d$/.test(date||''))date=today();
  const cur=Store.get('body',date),o=cur?clone(cur):{d:date},w=parseNum(wStr),wa=parseNum(waistStr);
  if(w!=null){if(w<30||w>250){toast('体重看起来不对，单位是 kg');return;}o.w=Math.round(w*10)/10;}
  if(wa!=null){if(wa<40||wa>200){toast('腰围看起来不对，单位是 cm');return;}o.waist=Math.round(wa*10)/10;}
  if(typeof o.w!=='number'){toast('先填体重');return;}
  o.d=date;document.activeElement&&document.activeElement.blur&&document.activeElement.blur();Store.put('body',date,o);toast('已保存');}

/* ---------- routing + render ---------- */
const TABS=['today','train','food','log'];
let pendingRender=false,prTimer=0;
function render(){const ae=document.activeElement;
  if(ae&&ae.tagName==='INPUT'&&ae.closest('.view')){pendingRender=true;return;}
  pendingRender=false;
  document.getElementById('dateText').textContent=`${mdText(today())} 周${WD[new Date().getDay()]}`;
  ({today:renderToday,train:renderTrain,food:renderFood,log:renderLog})[UI.tab]();}
function go(tab,fromHash){if(!TABS.includes(tab))tab='today';UI.tab=tab;
  document.querySelectorAll('.view').forEach(v=>{v.hidden=v.dataset.view!==tab;});
  document.querySelectorAll('.nav [data-tab]').forEach(b=>{if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  if(!fromHash&&location.hash!=='#'+tab){try{history.replaceState(null,'','#'+tab);}catch(e){}}
  render();window.scrollTo(0,0);}
document.addEventListener('focusout',()=>{if(!pendingRender)return;clearTimeout(prTimer);prTimer=setTimeout(()=>{if(pendingRender)render();},450);});
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='tab')go(t.dataset.tab);
  else if(a==='hint-off'){lsSet('t78-hint','1');render();}
  else if(a==='kind'){UI.override=t.dataset.k;UI.workout=false;render();}
  else if(a==='ex')openSheet(t.dataset.ex,t.dataset.rx);
  else if(a==='close')closeSheet();
  else if(a==='variant'){UI.sheet.v=+t.dataset.i;renderSheet();}
  else if(a==='play')t.textContent=Player.toggle()?'暂停':'播放';
  else if(a==='start')startWorkout(t.dataset.k);
  else if(a==='finish')finishWorkout(t.dataset.k);
  else if(a==='reopen'){UI.workout=true;UI.override=t.dataset.k;render();}
  else if(a==='tick')tickSet(t);
  else if(a==='ctype')setCardio({kind:t.dataset.t});
  else if(a==='cdone'){const s=Store.get('sessions',today()+'_C')||{},m=parseNum((document.getElementById('cmin')||{}).value);setCardio({done:!s.done,min:m??s.min??null});if(!s.done)toast('有氧完成，已保存');}
  else if(a==='habit')toggleHabit(t.dataset.k);
  else if(a==='p-add')addProtein(PROTEIN_ADD[+t.dataset.i].g);
  else if(a==='p-undo')undoProtein();
  else if(a==='export')exportData();
  else if(a==='wq-save')saveWeight(today(),(document.getElementById('wq')||{}).value,null);
  else if(a==='log-save')saveWeight(document.getElementById('ld').value,document.getElementById('lw').value,document.getElementById('lwa').value);});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset)return;
  if(t.dataset.act==='in')updateSet(t.dataset.id,t.dataset.ex,+t.dataset.n,{[t.dataset.f]:parseNum(t.value)},false);
  else if(t.dataset.act==='cmin')setCardio({min:parseNum(t.value)},true);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.sheet)closeSheet();});
document.querySelectorAll('.nav [data-tab]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
document.getElementById('timerSkip').addEventListener('click',()=>Timer.stop());
document.getElementById('timerAdd').addEventListener('click',()=>Timer.add(30));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')render();});
window.addEventListener('hashchange',()=>go(location.hash.slice(1),true));

Store.on(render);
go((location.hash||'#today').slice(1),true);
Store.init();
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
</script>
</body>
